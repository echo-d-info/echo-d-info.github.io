<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>地震情報リスト</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/animation.css" />
</head>

<body>
  <div id="app">

    <!-- 上部バー（状態表示） -->
    <div id="status-bar">
      <div id="updated">最終更新: --:--:--</div>
      <div id="status"></div>
    </div>

    <!-- 最新地震（大きく表示） -->
    <div id="latest"></div>

    <!-- 過去地震リスト -->
    <div id="list"></div>

    <!-- エラー表示 -->
    <div id="error" class="hidden">通信エラー</div>

    <!-- データなし -->
    <div id="empty" class="hidden">現在表示できる地震情報はありません</div>

  </div>

  <!-- JS（モジュール読み込み） -->
  <script type="module" src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[v0.1.13]アメダス観測一覧</title>

<style>
body{
  font-family:sans-serif;
  margin:0;
  padding:8px 12px;
  background:#f5f5f5;
}

h1{
  margin:0 0 4px 0;
  font-size:18px;
}

#status{
  margin:0 0 6px 0;
  font-size:12px;
}

#toggleSettings{
  font-size:12px;
  padding:4px 8px;
  margin-bottom:6px;
  cursor:pointer;
}

#settings{
  display:none;
  margin:6px 0 10px 0;
}

#settings label{
  display:inline-block;
  font-size:12px;
  margin-right:8px;
}

/* ===== テーブル ===== */
.table-wrap{
  overflow:auto;
  background:#fff;
  border-radius:10px;
  max-height:calc(100vh - 150px);
}

table{
  border-collapse:collapse;
  width:100%;

}

th,td{
  border:1px solid #ddd;
  padding:4px 6px;
  text-align:center;
  white-space:nowrap;
  font-size:12px;
}

thead th{
  position: sticky;
  top: 0;
  z-index: 999;
  background:#222;
  color:#fff;
}

tr:nth-child(even){
  background:#fafafa;
}

/* 地点 */
.station-name{
  font-weight:bold;
  font-size:13px;
  line-height:1.1;
}

.station-code{

  max-width:400px;
}

#search-count{ font-size:12px; color:#666; white-space:nowrap; }

<table>
<thead>
<tr id="thead-row">

</tr>
</thead>

</div>

  {codes:[85], ja:["大分","おおいた","オオイタ","大分県"], en:["oita","ōita"]},

  {codes:[87], ja:["鹿児島","かごしま","カゴシマ","鹿児島県"], en:["kagoshima"]},

];

// codeから都道府県コード(先頭2桁)を返す
function prefCode(code){
  return Math.floor(parseInt(code)/1000);
}

// codeから都道府県名（漢字）を返す
function prefName(code){
  const pc = prefCode(code);
  const pref = prefSearch.find(p => p.codes.includes(pc));
  return pref ? pref.ja[0] : "";
}

// 全角数字→半角数字
function toHalfNum(s){
  return s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}

// ひらがな→カタカナ
function toKatakana(s){
  return s.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60));
}

// カタカナ→ひらがな
function toHiragana(s){
  return s.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60));
}

// ひらがな→ヘボン式ローマ字
function toRomaji(hira){
  const table = [
    ["うぁ","wa"],["うぃ","wi"],["うぇ","we"],["うぉ","wo"],
    ["きゃ","kya"],["きゅ","kyu"],["きょ","kyo"],
    ["しゃ","sha"],["しゅ","shu"],["しょ","sho"],["し","shi"],
    ["ちゃ","cha"],["ちゅ","chu"],["ちょ","cho"],["ち","chi"],
    ["つぁ","tsa"],["つぃ","tsi"],["つぇ","tse"],["つぉ","tso"],["つ","tsu"],
    ["にゃ","nya"],["にゅ","nyu"],["にょ","nyo"],
    ["ひゃ","hya"],["ひゅ","hyu"],["ひょ","hyo"],
    ["みゃ","mya"],["みゅ","myu"],["みょ","myo"],
    ["りゃ","rya"],["りゅ","ryu"],["りょ","ryo"],
    ["ぎゃ","gya"],["ぎゅ","gyu"],["ぎょ","gyo"],
    ["じゃ","ja"],["じゅ","ju"],["じょ","jo"],["じ","ji"],
    ["ぢゃ","ja"],["ぢゅ","ju"],["ぢょ","jo"],["ぢ","ji"],
    ["びゃ","bya"],["びゅ","byu"],["びょ","byo"],
    ["ぴゃ","pya"],["ぴゅ","pyu"],["ぴょ","pyo"],
    ["ふぁ","fa"],["ふぃ","fi"],["ふぇ","fe"],["ふぉ","fo"],["ふ","fu"],
    ["ゔぁ","va"],["ゔぃ","vi"],["ゔぇ","ve"],["ゔぉ","vo"],["ゔ","vu"],
    ["てぃ","ti"],["でぃ","di"],["でゅ","dyu"],
    ["っか","kka"],["っき","kki"],["っく","kku"],["っけ","kke"],["っこ","kko"],
    ["っさ","ssa"],["っし","sshi"],["っす","ssu"],["っせ","sse"],["っそ","sso"],
    ["った","tta"],["っち","cchi"],["っつ","ttsu"],["って","tte"],["っと","tto"],
    ["っな","nna"],["っに","nni"],["っぬ","nnu"],["っね","nne"],["っの","nno"],
    ["っは","hha"],["っひ","hhi"],["っふ","ffu"],["っへ","hhe"],["っほ","hho"],
    ["っま","mma"],["っみ","mmi"],["っむ","mmu"],["っめ","mme"],["っも","mmo"],
    ["っや","yya"],["っゆ","yyu"],["っよ","yyo"],
    ["っら","rra"],["っり","rri"],["っる","rru"],["っれ","rre"],["っろ","rro"],
    ["っわ","wwa"],["っを","wwo"],["っ","t"],
    ["んあ","n'a"],["んい","n'i"],["んう","n'u"],["んえ","n'e"],["んお","n'o"],["ん","n"],
    ["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],
    ["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],
    ["さ","sa"],["す","su"],["せ","se"],["そ","so"],
    ["た","ta"],["て","te"],["と","to"],
    ["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"],
    ["は","ha"],["ひ","hi"],["へ","he"],["ほ","ho"],
    ["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"],
    ["や","ya"],["ゆ","yu"],["よ","yo"],
    ["ら","ra"],["り","ri"],["る","ru"],["れ","re"],["ろ","ro"],
    ["わ","wa"],["を","wo"],
    ["が","ga"],["ぎ","gi"],["ぐ","gu"],["げ","ge"],["ご","go"],
    ["ざ","za"],["ず","zu"],["ぜ","ze"],["ぞ","zo"],
    ["だ","da"],["づ","zu"],["で","de"],["ど","do"],
    ["ば","ba"],["び","bi"],["ぶ","bu"],["べ","be"],["ぼ","bo"],
    ["ぱ","pa"],["ぴ","pi"],["ぷ","pu"],["ぺ","pe"],["ぽ","po"],
    ["ぁ","a"],["ぃ","i"],["ぅ","u"],["ぇ","e"],["ぉ","o"],
    ["ゃ","ya"],["ゅ","yu"],["ょ","yo"],
    ["ー",""],["、",""],["。",""],["・",""],
  ];
  let result = hira;
  for(const [k,v] of table){
    result = result.replaceAll(k,v);
  }

}

// 漢字文字列をローマ字変換（ひらがな経由は不可なので、prefSearchのよみがなを使う）
// 地点名はひらがなデータがないため、ローマ字マッチはprefSearchのみに適用

// =====================
// 検索クエリに一致するか判定
// =====================
function matchStation(code, st, query){
  if(!query) return true;

  const q = toHalfNum(query.trim().toLowerCase());
  if(!q) return true;

  // クエリのひらがな・カタカナ両方を用意
  const qHira = toHiragana(q);
  const qKata = toKatakana(q);

  function hit(target){
    const t = (target||"").toLowerCase();
    return t.includes(q) || t.includes(qHira) || t.includes(qKata);
  }

  // 観測番号（全角半角対応）
  if(String(code).includes(q)) return true;

  // 地点名（漢字・ひらがな・カタカナ）
  if(hit(st.name)) return true;

  // 都道府県マッチ
  const pc = prefCode(code);
  const pref = prefSearch.find(p => p.codes.includes(pc));
  if(pref){
    // 漢字・かな一致
    if(pref.ja.some(j => hit(j))) return true;
    // 英語・ローマ字一致（クエリがアルファベットのみの場合）
    if(pref.en.some(e => e.includes(q))) return true;
    // よみがな(ひらがな)をローマ字変換して部分一致
    const yomi = pref.ja.find(j => /^[\u3041-\u3096]+$/.test(j));
    if(yomi){
      const romaji = toRomaji(yomi);
      // 長音正規化: ou→o, oo→o, uu→u（hokkaido, tokyo等に対応）
      const romajiNorm = romaji.replace(/ou/g,"o").replace(/oo/g,"o").replace(/uu/g,"u");
      if(romaji.includes(q) || romajiNorm.includes(q)) return true;
    }
  }

  return false;
}

// =====================
// 検索UI
// =====================
let searchQuery = "";

document.getElementById("search-input").addEventListener("input", e => {
  searchQuery = e.target.value;
  if(Object.keys(stationsCache).length === 0) return;
  buildTable(stationsCache, amedasCache);
});


let state = {};
let stationsCache = {};
let amedasCache = {};

// =====================
// 設定UI
// =====================
const settings = document.getElementById("settings");
const toggleSettings = document.getElementById("toggleSettings");

toggleSettings.onclick = () => {
  const open = settings.style.display === "block";
  settings.style.display = open ? "none" : "block";
  toggleSettings.textContent = open ? "▼ 設定" : "▲ 設定";
};

function buildControls(){
  for(const key in elements){

    state[key] = true;

    const label = document.createElement("label");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = true;

    cb.onchange = () => {
      state[key] = cb.checked;
      buildHeader();
      buildTable(stationsCache, amedasCache);
    };

    label.appendChild(cb);
    label.appendChild(document.createTextNode(elements[key].name));

    settings.appendChild(label);
  }
}

// =====================
// 値取得
// =====================
function getValue(obj,key){

  if(!obj || !(key in obj)) return "--";

  const v = obj[key][0];
  if(v === null || v === undefined) return "--";

  if(key === "windDirection"){
    return windDirectionMap[v] ?? v;
  }

  return v;
}

// =====================
// ヘッダー
// =====================
function buildHeader(){

  const tr = document.getElementById("thead-row");

  tr.innerHTML = "<th>地点</th>"; // ★これ必須
  
  for(const k in elements){

    if(!state[k]) continue;

    const th = document.createElement("th");
    const e = elements[k];

    th.innerHTML = `
      <div class="th-name">${e.name}</div>
      ${e.unit ? `<div class="th-unit">${e.unit}</div>` : ``}
    `;

    tr.appendChild(th);
  }
}

// =====================
// fetch stations
// =====================
async function fetchStations(){
  const res = await fetch("./points.json");
  return await res.json();
}

// =====================
// fetch amedas
// =====================
async function fetchAmedas(){

  let date = new Date();
  date.setSeconds(0);
  date.setMilliseconds(0);
  date.setMinutes(Math.floor(date.getMinutes()/10)*10);

  for(let i=0;i<20;i++){

    const t = getTimeString(date);
    const url = `https://www.jma.go.jp/bosai/amedas/data/map/${t}.json`;

    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error();
      const data = await res.json();

      document.getElementById("status").textContent =
        `データ時刻: ${t}`;

      return data;

    }catch(e){
      date.setMinutes(date.getMinutes()-10);
    }
  }

  document.getElementById("status").textContent = "データ取得失敗（時間をおいて再読み込みしてください）";
  throw new Error("取得失敗");
}

// =====================
// 時刻
// =====================
function getTimeString(date){
  // JSTに変換（UTC+9）してフォーマット
  const jst = new Date(date.getTime() + 9 * 60 * 60 * 1000);
  return (
    String(jst.getUTCFullYear()) +
    String(jst.getUTCMonth()+1).padStart(2,"0") +
    String(jst.getUTCDate()).padStart(2,"0") +
    String(jst.getUTCHours()).padStart(2,"0") +
    String(jst.getUTCMinutes()).padStart(2,"0") +
    "00"
  );
}

// =====================
// 表生成
// =====================
function buildTable(stations, amedas){

  stationsCache = stations;
  amedasCache = amedas;

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  let count = 0;
  const total = Object.keys(stations).length;

  for(const code in stations){

    const st = stations[code];

    if(!matchStation(code, st, searchQuery)) continue;

    count++;
    const d = amedas[code];

    const tr = document.createElement("tr");

    const td0 = document.createElement("td");
    td0.className = "station-cell";

    const nameDiv = document.createElement("div");
    nameDiv.className = "station-name";
    nameDiv.textContent = `${prefName(code)} ${st.name}`;

    const codeDiv = document.createElement("div");
    codeDiv.className = "station-code";
    codeDiv.textContent = code;

    td0.appendChild(nameDiv);
    td0.appendChild(codeDiv);
    tr.appendChild(td0);

    for(const k in elements){

      if(!state[k]) continue;

      const td = document.createElement("td");
      td.textContent = getValue(d,k);
      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  }

  document.getElementById("search-count").textContent =
    searchQuery ? `${count} / ${total} 件` : `${total} 件`;
}

// =====================
// 起動
// =====================
(async () => {

  try{
    const stations = await fetchStations();

    buildControls(); // stateを先に初期化してからヘッダーを生成
    buildHeader();

    const amedas = await fetchAmedas();

    buildTable(stations, amedas);

  }catch(e){
    document.getElementById("status").textContent =
      `エラー: ${e.message}`;
  }

})();

</script>
